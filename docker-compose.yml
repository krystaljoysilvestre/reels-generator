services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reels_dev
    ports:
      # Bind to loopback only — an unqualified "5433:5432" listens on 0.0.0.0, exposing Postgres
      # (postgres/postgres) to anyone on the same LAN/Wi-Fi. Local tooling reaches it via 127.0.0.1.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      # Loopback only — unauthenticated Redis on 0.0.0.0 is a job-injection vector (BullMQ runs on it).
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
