services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reels_dev
    ports:
      # Bind to loopback only — an unqualified "5433:5432" listens on 0.0.0.0, exposing Postgres
      # (postgres/postgres) to anyone on the same LAN/Wi-Fi. Local tooling reaches it via 127.0.0.1.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      # Loopback only — unauthenticated Redis on 0.0.0.0 is a job-injection vector (BullMQ runs on it).
      # 6380 (not the default 6379) so this project's redis can never collide with another local
      # project's — same reasoning as Postgres on 5433.
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional connection pooler for when many web/worker processes run (each opens its own pool → they
  # exhaust Postgres's connection limit fast). Opt-in: `docker compose --profile scale up pgbouncer`.
  # To route through it, point DATABASE_URL at localhost:6432 and set PGBOUNCER=true (disables prepared
  # statements — required for transaction pooling; see packages/db/src/client.ts). Starting point — tune
  # pool sizes to the deploy.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    profiles: ["scale"]
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: reels_dev
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "25"
      AUTH_TYPE: scram-sha-256
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:6432:5432"

volumes:
  postgres_data:
  redis_data:
