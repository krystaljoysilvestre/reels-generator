# kendrix.io "Get access" waitlist worker.

name = "kendrix-access-inbox"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Same reasoning as contact-inbox: no destination_address pin, because the binding may send to
# any address already verified under kendrix.io → Email Routing → Destination addresses, and the
# actual inbox is the DESTINATION secret rather than a value in git.
send_email = [{ name = "INBOX" }]

# The waitlist itself. `database_id` is filled in by `wrangler d1 create` — see README.
[[d1_databases]]
binding = "DB"
database_name = "kendrix-access"
database_id = "f8fe7a4a-f28e-49af-8ed1-1879b5e9876a"
migrations_dir = "migrations"

# Secrets (set with `wrangler secret put`):
#   DESTINATION  — verified inbox to notify (the one hello@/privacy@ forward to).
#   ACCESS_TOKEN — shared token; must match KENDRIX_LIST_API_KEY in apps/landing.

# Keep this LAST. A bare `[table]` header captures every key below it, so anything placed after
# this line stops being a top-level binding — that is how `send_email` briefly became a field of
# `[observability]`. New bindings go ABOVE this block.
#
# Persisted logs matter here because a failed notification is swallowed on purpose: without them
# there is no trace that a signup went unannounced, which is how the first two were missed.
[observability]
enabled = true
