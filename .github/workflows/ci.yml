name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reels_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reels_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reels_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reels_test
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. The version lives in package.json's `packageManager`,
      # which is also what corepack and Vercel read, so there is one source of truth. Setting
      # both makes this action hard-fail with "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate test database
        run: pnpm db:migrate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      - name: Production build
        run: pnpm build
